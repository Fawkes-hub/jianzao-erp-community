name: 功能建议
description: 提出一个新功能或改进建议
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        社区版范围是「基础资料 + 采购/销售/库存/财务/对账/打印」。
        生产、委外、盘点、看板、备份、小程序、SaaS 账户层属于商业版，不在本仓库范围内，见 [COMMERCIAL.md](../blob/main/COMMERCIAL.md)。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到什么问题
      description: 描述业务场景，而不是直接给方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的解法
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 我确认该建议属于社区版功能范围
          required: true
