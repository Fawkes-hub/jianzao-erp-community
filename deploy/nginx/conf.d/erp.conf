# 登录接口按来源 IP 限流：每分钟 20 次，允许 10 次突发
# 注意：经 frp TCP 映射时 nginx 只能看到 frpc 的地址，实际是全局共享一个限流桶
limit_req_zone $binary_remote_addr zone=erp_login:10m rate=20r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        # SPA 路由回落：真实构建的 index.html。
        # 未构建时 deploy/plus-ui-dist/index.html 是「前端未构建」提示页（由构建脚本保持）。
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 登录接口：nginx 层先做一道限流，后端 @RateLimiter 再兜底
    location = /prod-api/auth/login {
        limit_req zone=erp_login burst=10 nodelay;
        proxy_pass http://erp-app:8080/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /prod-api/ {
        proxy_pass http://erp-app:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

